
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.F.B // SPECIAL DEFENSE PROTOCOL</title>
    <style>
        :root {
            --glow: #ff0000;       /* Лютый, яростный чисто-красный неон */
            --glow-dim: #990000;   /* Контрастный кровавый бордер */
            --bg: #050000;         
            --bg-panel: rgba(12, 0, 0, 0.93); /* Плотная чёрная подложка, чтобы текст не размывался */
            --err: #ff0000;        
            --acc: #ffffff;        /* Белые тактические акценты */
        }
        body {
            background-color: var(--bg);
            color: var(--glow);
            font-family: 'Courier New', monospace;
            font-size: 16px;       
            font-weight: 700;      /* Текст сделан плотнее для агрессивного вида */
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: " ";
            display: block;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(255, 0, 0, 0.02) 50%, rgba(0, 0, 0, 0.5) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 0, 0, 0), rgba(255, 0, 0, 0.04));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }
        body::after {
            background: linear-gradient(rgba(0, 0, 0, 0) 90%, rgba(255, 0, 0, 0.06) 95%, rgba(0, 0, 0, 0) 100%);
            background-size: 100% 300%;
            animation: scanline 6s linear infinite; /* Ускорили сканлайны для динамики */
            z-index: 1000;
        }
        @keyframes scanline {
            0% { background-position: 0 -300%; }
            100% { background-position: 0 300%; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-5px, 2px); }
            40%, 80% { transform: translate(5px, -2px); }
        }
        .shake { animation: shake 0.15s ease-in-out 2; }
        .terminal-box {
            width: 100%;
            max-width: 850px;
            background: var(--bg-panel);
            border: 2px solid var(--glow); /* Толстая светящаяся рамка */
            border-radius: 4px;
            padding: 35px;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.25), inset 0 0 20px rgba(255, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
        }
        .header {
            color: var(--glow);
            border-bottom: 2px solid rgba(255, 0, 0, 0.3);
            padding-bottom: 18px;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 0, 0, 0.8); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .hub-logo {
            display: block;
            width: 250px;           
            height: auto;
            margin: 0 auto 20px auto; 
            opacity: 0.98;
            pointer-events: none;
            filter: drop-shadow(0 0 25px var(--glow)); 
        }
        .line {
            line-height: 1.6;
            margin-bottom: 10px;
            word-break: break-all;
            white-space: pre-wrap;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.4); 
        }
        .input-line {
            display: flex;
            align-items: center;
            margin-top: 25px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        .input-line.active { opacity: 1; visibility: visible; }
        .prompt {
            margin-right: 12px;
            color: var(--glow);
            font-weight: bold;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--glow);
        }
        .input-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
        }
        input {
            position: absolute;
            inset: 0;
            opacity: 0;
            background: transparent;
            border: none;
            outline: none;
            cursor: default;
        }
        .custom-view {
            color: #ffffff;        
            font-family: inherit;
            font-size: inherit;
            font-weight: bold;
            white-space: pre-wrap;
            display: inline-flex;
            align-items: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }
        .custom-view::after {
            content: '_';
            margin-left: 4px;
            color: var(--glow);     
            animation: blink 0.6s infinite;
            text-shadow: 0 0 12px var(--glow);
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .error { color: var(--err); font-weight: bold; text-shadow: 0 0 12px rgba(255, 0, 0, 0.7); }
        .success { color: var(--acc); font-weight: bold; text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
        .gray { color: rgba(255, 0, 0, 0.45); } 
    </style>
</head>
<body>
<div class="terminal-box" id="term">
    <div class="header" id="hd">
        <!-- Твой новый запрашиваемый файл TFB_logo.png -->
        <img src="TFB_logo.png" class="hub-logo" alt="T.F.B LOGO">
        TASK FORCE BERSERK // MILITARY SECURITY CONTROL NETWORK
    </div>
    <div id="out"></div>
    <div class="input-line" id="blk">
        <span class="prompt" id="pr">SECURE BARRICADE TOKEN:</span>
        <div class="input-wrapper">
            <input type="text" id="inp" autocomplete="off" disabled>
            <div class="custom-view" id="view"></div>
        </div>
    </div>
</div>
<script>
const CFG = { 
    REAL_TOKEN: "501", // Настоящий боевой токен тяжелой пехоты Berserk
    SPD: 12 /* Слегка ускорили печать под ритм боевой тревоги */
};
const DOM = { 
    term: document.getElementById('term'), 
    inp: document.getElementById('inp'), 
    view: document.getElementById('view'), 
    out: document.getElementById('out'), 
    pr: document.getElementById('pr'), 
    blk: document.getElementById('blk') 
};
let step = 'login', isMask = false, dialogueStage = 0, wordTimer = null;
const delay = ms => new Promise(r => setTimeout(r, ms));

let audioCtx = null;

function playBeep(f, t, d) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = t; 
        osc.frequency.value = f; 
        g.gain.setValueAtTime(0.02, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + d);
        osc.connect(g); 
        g.connect(audioCtx.destination); 
        osc.start(); 
        osc.stop(audioCtx.currentTime + d);
    } catch(e) {}
}

function addLine(txt, cls = "") {
    const d = document.createElement('div'); 
    d.className = `line ${cls}`; 
    d.textContent = txt; 
    DOM.out.appendChild(d);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); 
    return d;
}
async function type(txt, cls = "") {
    const d = addLine("", cls);
    for (let i = 0; i < txt.length; i++) {
        d.textContent += txt.charAt(i); 
        if (Math.random() > 0.3) playBeep(550, 'sawtooth', 0.02); /* Более грубый, механический лязг звука */
        await delay(CFG.SPD);
    }
}

/* Полностью новые логи развертывания тяжелого оборонного периметра Berserk */
async function runBootLogs() {
    const p = [
        "INITIALIZING ARMORED DEFENSE LINE... ONLINE", 
        "CONNECTING CALIBER TURRET LINKS... CONFIGURED", 
        "ENGAGING SECURE BUNKER PERIMETER... ISOLATED", 
        "SCANNING BERSERK GARISON REGIMENT... DISCIPLINE 100%", 
        "CRITICAL SECURITY PROTOCOL 'T.F.B' ENGAGED."
    ];
    for (let i = 0; i < p.length; i++) {
        await delay(100 + Math.random() * 100); 
        addLine("[T.F.B-FORT] | " + p[i], 'gray'); 
        playBeep(70, 'sawtooth', 0.01);
    }
    await delay(400); 
    await type("SYS: MILITARY GATEWAY DETECTED. BARRICADE KEY REQUIRED.", "gray");
    await type("SYS: LETHAL FORCE IS AUTHORIZED FOR INTRUDERS.", "error"); 
    ask('SECURE BARRICADE TOKEN:', 'login', false);
}

function ask(p, s, m) { 
    step = s; 
    isMask = m; 
    DOM.pr.textContent = p; 
    DOM.inp.value = DOM.view.textContent = ""; 
    DOM.inp.disabled = false; 
    DOM.blk.classList.add('active'); 
    DOM.inp.focus(); 
}

function err(m) { 
    DOM.term.classList.add('shake'); 
    playBeep(120, 'sawtooth', 0.4); 
    setTimeout(() => DOM.term.classList.remove('shake'), 400); 
    addLine(m, "error"); 
}

// Карательный Скрамблер T.F.B за невыполнение боевого устава
async function terminalScramblerDie(m) {
    clearTimeout(wordTimer);
    DOM.blk.classList.remove('active');
    DOM.inp.disabled = true;
    err(m);
    await delay(1000);
    await type("[МОЛОТ]: Трибунал окончен, сопляк. Расстрелять шпиона через Скрамблер.", "error");
    await delay(1500);
    DOM.out.innerHTML = "";
    document.getElementById('hd').style.display = 'none';
    playBeep(50, 'sawtooth', 2.5);
    DOM.term.classList.add('shake');
    
    const errBox = addLine("\n\n\n\n      ███████  ██████  ██████   ██████  ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      █████    ██████  ██████  ██    ██ ██████  \n      ██       ██   ██ ██   ██ ██    ██ ██   ██ \n      ███████  ██   ██ ██   ██  ██████  ██   ██ \n\n", "error");
    errBox.style.fontSize = "22px"; errBox.style.textAlign = "center";
    errBox.style.textShadow = "0 0 15px #ff0000";
    await delay(2000);
    location.reload();
}

async function bar() {
    const d = addLine("", 'success');
    for (let p = 0; p <= 100; p += 5) { 
        d.textContent = `LOADING HEAVY ARMORED NETWORKS: [${"█".repeat(p/5)}${".".repeat(20-(p/5))}] ${p}%`; 
        playBeep(250 + p * 2, 'sawtooth', 0.02); 
        await delay(45); 
    }
}
// Перехват канала Генерал-майором при вводе 868
async function triggerAmbushDialogue() {
    clearTimeout(wordTimer);
    DOM.blk.classList.remove('active'); DOM.inp.disabled = true;
    playBeep(440, 'sawtooth', 0.4); playBeep(220, 'sawtooth', 0.4);
    err("⚠️ ВНИМАНИЕ: СЕТЕВОЙ ПЕРЕХВАТ! ПРИНУДИТЕЛЬНЫЙ ДОПРОС ГЕНЕРАЛ-МАЙОРА ОБОРОНЫ КОМПЛЕКСА T.F.B");
    await delay(1200);
    await type("[ШТAB]: Зафиксирован несанкционированный токен 868. Шлюз заблокирован бронеплитами.", "gray");
    await type("[МОЛОТ]: Так, смирно! Говорит Генерал-майор позывной 'Молот', командующий Task Force Berserk.", "success");
    await type("[МОЛОТ]: Твой код 868 — это старая тревожная метка, парень. Ты залез на защищенный сервер тяжелой пехоты, охраняющей комплекс.", "success");
    await type("[МОЛОТ]: Мы ведем войну против шпионов из Атлантиса, которые пиздят наши документы и чертежи техники. И мы побеждаем всегда благодаря нашей лютой дисциплине, закаленному характеру и адским ежедневным тренировкам! А шпионов мы расстреливаем на месте. Отвечай на вопросы трибунала, сопляк. 15 секунд на каждый.", "success");
    await delay(500);
    dialogueStage = 0;
    nextDialogueStep();
}

async function nextDialogueStep() {
    clearTimeout(wordTimer);
    if (dialogueStage === 0) {
        await type("\n[МОЛОТ]: ВОПРОС 1. Как назывался вирус в секретном отчёте департамента Атлантиса, который эти крысы у нас украли?", "success");
        addLine("1. Модификатор SC-REVERSE", "gray"); addLine("2. Вирус WE-30", "gray"); addLine("3. Протокол ATL-4091", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ТАЙМАУТ ТРИБУНАЛА. РАССТРЕЛ НА МЕСТЕ ЗА МОЛЧАНИЕ."), 15000);
    } 
    else if (dialogueStage === 1) {
        await type("\n[МОЛОТ]: ВОПРОС 2. Как звали связующего по ТОС со стороны Атлантиса, который запрашивал верификацию в ворованных базах?", "success");
        addLine("1. Operator Bill", "gray"); addLine("2. Commander Sin", "gray"); addLine("3. Agent Andrey", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. СВЯЗЬ АННУЛИРОВАНА."), 15000);
    }
    else if (dialogueStage === 2) {
        await type("\n[МОЛОТ]: ВОПРОС 3. Каким образом ты вообще пронюхал про существование базы данных Атлантиса?", "success");
        addLine("1. Через биографию Сергея Долороффа", "gray"); addLine("2. Перехвачено со спутника", "gray"); addLine("3. Через досье сотрудника Атлантиса", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. СВЯЗЬ АННУЛИРОВАНА."), 15000);
    }
    else if (dialogueStage === 3) {
        await type("\n[МОЛОТ]: ВОПРОС 4. Какой ID был у сотрудника из того досье, где лежала информация про базу?", "success");
        addLine("1. Сотрудник ID: 231", "gray"); addLine("2. Сотрудник ID: 504", "gray"); addLine("3. Сотрудник ID: 712", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. СВЯЗЬ АННУЛИРОВАНА."), 15000);
    }
    else if (dialogueStage === 4) {
        await type("\n[МОЛОТ]: ВОПРОС 5. Ну-ка проверим твои знания геополитики. Как зовут командира Рассонии?", "success");
        addLine("1. Генерал Седой", "gray"); addLine("2. Командир Ворон", "gray"); addLine("3. Командир Син", "gray");
        ask('ВЫБЕРИТЕ ОПЦИЮ (1-3):', 'ambush_choice', false);
        wordTimer = setTimeout(() => terminalScramblerDie("🚨 ВРЕМЯ ИСТЕКЛО. СВЯЗЬ АННУЛИРОВАНА."), 15000);
    }
}
async function successAmbushDialogue() {
    clearTimeout(wordTimer);
    await type("\n[МОЛОТ]: Рапорт принят, боец! У тебя стальной характер и отличная память. Ты явно не штабная крыса Долороффа.", "success");
    await type("[МОЛОТ]: Записывай боевой токен доступа к защищенным оружейным серверам Task Force Berserk — 501", "success");
    await type("[МОЛОТ]: Вводи его на главном экране. Бери под контроль турели комплекса и помоги нам раздавить Атлантис. Отбой!", "success");
    playBeep(200, 'sawtooth', 0.6);
    await delay(3500);
    DOM.out.innerHTML = "";
    step = 'login';
    ask('ENTER OPERATION AUTH TOKEN:', 'login', false);
}

// Главное меню бронированных серверов Task Force Berserk (по коду 501)
async function openSecureLasMenu() {
    await type("===================================================", "gray");
    await type("ACCESS GRANTED. T.F.B BERSERK CONTROL SECTOR v1.0", "success");
    await type("ПЕРИМЕТР БЕЗОПАСНОСТИ КОМПЛЕКСА ПОД КОНТРОЛЕМ.", "success");
    await type("1. СТАТУС БРОНЕПЛИТ И ОБОРОНЫ ШЛЮЗОВ", "success");
    await type("2. СЕТЬ АВТОМАТИЧЕСКИХ ТУРЕЛЕЙ КАЛИБРА", "success");
    await type("3. ЖУРНАЛ СУТОЧНЫХ ТРЕНИРОВОК ЛИЧНОГО СОСТАВА", "success");
    await type("4. ВЫЙТИ ИЗ ТАКТИЧЕСКОЙ СЕТИ", "success");
    await type("===================================================", "gray");
    ask('ENTER COMMAND:', 'las_menu', false);
}
DOM.inp.oninput = () => { if(step !== 'game') DOM.view.textContent = isMask ? "*".repeat(DOM.inp.value.length) : DOM.inp.value; };
DOM.inp.onkeydown = async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault(); 

    const v = DOM.inp.value, cv = v.trim(); if (!v) return;

    DOM.blk.classList.remove('active'); DOM.inp.disabled = true; 
    addLine(DOM.pr.textContent + " " + (isMask ? "*".repeat(v.length) : cv), 'success'); 
    await delay(300);
    
    if (step === 'login') {
        if (cv === '868') {
            triggerAmbushDialogue(); // Старт трибунала Молота
        } else if (cv === CFG.REAL_TOKEN) {
            await bar(); // Тяжёлый прогресс-бар
            await openSecureLasMenu(); // Тяжёлое меню T.F.B
        } else {
            err("SECURITY BREACH: ACCESS DENIED. ACCOUNT LOCKDOWN.");
            await delay(1500); ask('SECURE BARRICADE TOKEN:', 'login', false);
        }
    } 
    else if (step === 'ambush_choice') {
        clearTimeout(wordTimer);
        
        // ВОПРОС 1: Вирус WE-30 (Ошибка — расстрел)
        if (dialogueStage === 0) {
            if (cv === '2') { dialogueStage = 1; nextDialogueStep(); } 
            else { await terminalScramblerDie("🚨 [МОЛОТ]: Неверно! Ты не знаешь, что у нас украли! Расстрелять!"); }
        } 
        // ВОПРОС 2: Bill (Ошибка — расстрел)
        else if (dialogueStage === 1) {
            if (cv === '1') { dialogueStage = 2; nextDialogueStep(); } 
            else { await terminalScramblerDie("🚨 [МОЛОТ]: Ошибка! Шпион не знает личный состав ТОС! Огонь!"); }
        }
        // ВОПРОС 3: ЛОВУШКА БИОГРАФИИ СЕРГЕЯ ДОЛОРОФФА
        else if (dialogueStage === 2) {
            if (cv === '3') { dialogueStage = 3; nextDialogueStep(); } 
            else if (cv === '1') {
                // Моментальная смерть за биографию Долороффа
                await terminalScramblerDie("🚨 [МОЛОТ]: Биография Долороффа?! Так ты щенок этой штабной гнили! Уничтожить цель!");
            } else { await terminalScramblerDie("🚨 [МОЛОТ]: Ложь! Ты не прошел верификацию источников. Стереть узел!"); }
        }
        // ВОПРОС 4: ЛОВУШКА ID 231
        else if (dialogueStage === 3) {
            if (cv === '2') {
                // Моментальная смерть за ID: 231
                await terminalScramblerDie("🚨 [МОЛОТ]: ID 231 — это личный шифр соглядатая Долороффа! Поймали шпиона Атлантиса! Сжечь порт!");
            } else if (cv === '1' || cv === '3') { dialogueStage = 4; nextDialogueStep(); } 
            else { await terminalScramblerDie("🚨 [МОЛОТ]: Ошибка в шифрах ID. Трибунал окончен."); }
        }
        // ВОПРОС 5: Командир Син
        else if (dialogueStage === 4) {
            if (cv === '3') { successAmbushDialogue(); } 
            else { await terminalScramblerDie("🚨 [МОЛОТ]: Не знать имя лидера союзной Рассонии?! Ты засланный казачок. Огонь на поражение."); }
        }
    }
    // Обработчик Главного меню серверов T.F.B Berserk
    else if (step === 'las_menu') {
        if (cv === '4') {
            await type(">>> ОТКЛЮЧЕНИЕ ОТ ВОЕННОЙ СЕТИ T.F.B...", "gray");
            await delay(1000); DOM.out.innerHTML = ""; step = 'login';
            ask('SECURE BARRICADE TOKEN:', 'login', false);
        } else if (cv === '1' || cv === '2' || cv === '3') {
            await type(">>> СИСТЕМА: ДАННЫЙ СЕКТОР ЗАБЛОКИРОВАН. ОЖИДАНИЕ ТАКТИЧЕСКИХ СКАНИРОВАНИЙ...", "error");
            await delay(1500); ask('ENTER COMMAND:', 'las_menu', false);
        } else {
            err("НЕВЕРНАЯ КОМАНДА."); await delay(1000); ask('ENTER COMMAND:', 'las_menu', false);
        }
    }
};
document.onclick = () => DOM.inp.disabled || DOM.inp.focus(); 
window.onload = runBootLogs;
</script>
</body>
</html>
